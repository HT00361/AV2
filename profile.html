<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#12161d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>AV2 Profile</title>
<style>
:root{
  --night:#12161d; --rock:#1b212b; --rock-2:#242c38; --rule:#333d4c;
  --lime:#d6d1c4; --lime-dim:#8d95a2; --cai:#c0261c; --cai-lift:#e04b3f;
  --sign:#e8b23a; --glacier:#5fa8bd; --dry:#e07a3a; --ok:#7fa860;
  --font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-disp:"Helvetica Neue","Arial Narrow",Roboto,Helvetica,Arial,sans-serif;
  --font-num:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--night);color:var(--lime);font-family:var(--font-ui);font-size:15px;
  display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

.bar{padding:calc(var(--safe-t) + 8px) 12px 8px;background:var(--rock);
  border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:9px;flex:0 0 auto}
.blaze{width:12px;height:24px;border-radius:1px;flex:0 0 auto;
  background:linear-gradient(to bottom,var(--cai) 0 33%,#fff 33% 67%,var(--cai) 67% 100%)}
.bar h1{margin:0;font-family:var(--font-disp);font-size:16px;font-weight:800;
  letter-spacing:.02em;text-transform:uppercase;line-height:1;flex:1}
.bar a{color:var(--lime-dim);font-size:12px;text-decoration:none;border:1px solid var(--rule);
  padding:6px 9px;border-radius:8px;flex:0 0 auto}

.readbar{flex:0 0 auto;display:flex;background:var(--rock-2);
  border-bottom:1px solid var(--rule);font-family:var(--font-num);font-size:11px}
.readbar div{flex:1;padding:6px 8px;min-width:0;border-right:1px solid var(--rule)}
.readbar div:last-child{border-right:0}
.readbar b{display:block;font-size:8.5px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--lime-dim);font-weight:600;font-family:var(--font-ui);margin-bottom:1px}
.readbar span{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

#stage{position:relative;flex:1 1 auto;min-height:150px;background:var(--night)}
#prof{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.chip{position:absolute;right:9px;top:9px;z-index:4;display:flex;flex-direction:column;gap:6px}
.chip button{width:38px;height:38px;border-radius:9px;background:rgba(27,33,43,.9);
  border:1px solid var(--rule);display:grid;place-items:center;font-size:14px;
  font-family:var(--font-disp);font-weight:700}
.chip button.live{border-color:var(--glacier);color:var(--glacier)}

.key{flex:0 0 auto;display:flex;gap:0;background:var(--rock);border-top:1px solid var(--rule);
  padding:6px 12px 7px;overflow-x:auto}
.key span{font-size:9px;color:var(--lime-dim);white-space:nowrap;margin-right:11px;line-height:1.5}
.key i{display:inline-block;width:14px;height:8px;border-radius:2px;margin-right:4px;vertical-align:-1px}

.days{flex:0 0 auto;max-height:32vh;overflow-y:auto;background:var(--night);
  border-top:1px solid var(--rule);padding-bottom:calc(var(--safe-b) + 8px)}
.dhead{display:flex;padding:7px 12px;background:var(--rock-2);position:sticky;top:0;
  font-size:8.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--lime-dim);font-weight:600}
.dhead span:first-child{flex:1}
.dhead span{width:60px;text-align:right}
.drow{display:flex;padding:8px 12px;border-top:1px solid var(--rule);font-size:12.5px;
  align-items:baseline;width:100%;text-align:left}
.drow .nm{flex:1;min-width:0}
.drow .nm b{display:block;font-weight:600;font-size:13px}
.drow .nm i{font-style:normal;font-size:10.5px;color:var(--lime-dim)}
.drow span{width:60px;text-align:right;font-family:var(--font-num);font-size:12px}
.drow .up{color:var(--dry)}
.drow.now{background:var(--rock)}
.drow.now .nm b{color:var(--sign)}
</style>
</head>
<body>

<header class="bar">
  <span class="blaze"></span>
  <h1>AV2 Profile</h1>
  <a href="./index.html">Map</a>
  <a href="./3d.html">3D</a>
</header>

<div class="readbar">
  <div><b>At crosshair</b><span id="rKm">—</span></div>

  <div><b>Gradient</b><span id="rGrad">—</span></div>
  <div><b>You</b><span id="rMe">GPS off</span></div>
</div>

<div id="stage">
  <canvas id="prof"></canvas>
  <div class="chip">
    <button id="btnMe" title="Centre on my position">◎</button>
    <button id="btnFit" title="Whole route">⤢</button>
    <button id="btnIn" title="Zoom in">+</button>
    <button id="btnOut" title="Zoom out">−</button>
  </div>
</div>

<div class="key" id="key"></div>

<div class="days">
  <div class="dhead"><span>Stage</span><span>km</span><span>ascent</span><span>descent</span></div>

function rad(d){return d*Math.PI/180}
function dist(a,b,c,d){
  var R=6371008.8,p=rad(a),q=rad(c),dp=rad(c-a),dl=rad(d-b);
  var h=Math.sin(dp/2)*Math.sin(dp/2)+Math.cos(p)*Math.cos(q)*Math.sin(dl/2)*Math.sin(dl/2);
  return 2*R*Math.asin(Math.min(1,Math.sqrt(h)));
}

/* ---- cumulative distance, smoothed elevation, gradient ---- */
var KM=[0], TOTAL=0, ELE=[], SM=[], GRAD=[];
(function(){
  for(var i=1;i<ROUTE.length;i++){
    TOTAL+=dist(ROUTE[i-1][0],ROUTE[i-1][1],ROUTE[i][0],ROUTE[i][1]);
    KM.push(TOTAL);
  }
  for(var j=0;j<ROUTE.length;j++) ELE.push(ROUTE[j][2]);
  /* Two separate jobs. Smoothing elevation over 120 m removes measurement noise.
     But gradient also needs a minimum horizontal baseline: consecutive simplified
     points can be 1 m apart, and dividing a 3 m rise by that reports 250%, which
     is nonsense. So gradient is measured over at least 40 m of ground. */
  var WIN=120, a=0, b=0;
  for(var k=0;k<ROUTE.length;k++){
    while(KM[a]<KM[k]-WIN/2) a++;
    while(b<ROUTE.length-1 && KM[b]<KM[k]+WIN/2) b++;
    var s=0;
    for(var m=a;m<=b;m++) s+=ELE[m];
    SM.push(s/(b-a+1));
  }
  var BASE=40, j=0;
  for(var n=0;n<ROUTE.length;n++){
    while(KM[n]-KM[j]>BASE && j<n-1) j++;
    var back=j;
    while(back>0 && KM[n]-KM[back]<BASE) back--;
    var run=KM[n]-KM[back];
    GRAD.push(run>=5 ? (SM[n]-SM[back])/run*100 : 0);
  }
})();

var BANDS=[
  {max:5,  c:"#5b7f6a", n:"under 5%"},
  {max:12, c:"#7fa860", n:"5–12%"},

  {max:45, c:"#c0261c", n:"30–45%"},
  {max:1e9,c:"#8d2b6b", n:"over 45%"}
];
function bandOf(g){
  var a=Math.abs(g);
  for(var i=0;i<BANDS.length;i++) if(a<BANDS[i].max) return BANDS[i];
  return BANDS[BANDS.length-1];
}

/* ---- project waypoints onto the route ---- */
(function(){
  PTS.forEach(function(p){
    var bi=0,bd=1e12;
    for(var i=0;i<ROUTE.length;i++){
      var d=dist(p.lat,p.lon,ROUTE[i][0],ROUTE[i][1]);
      if(d<bd){bd=d;bi=i}
    }
    p.km=KM[bi]; p.off=bd;
  });
})();
function dayEndKm(i){
  var q=PTS.filter(function(p){return p.d===i});
  if(!q.length) return null;
  return Math.max.apply(null,q.map(function(p){return p.km}));
}
function dayStartKm(i){
  for(var j=i-1;j>=0;j--){ var e=dayEndKm(j); if(e!=null) return e; }
  return 0;
}
function statsBetween(k0,k1){
  var up=0,dn=0,mx=0,i0=idxAt(k0),i1=idxAt(k1);
  for(var i=i0+1;i<=i1;i++){
    var dz=SM[i]-SM[i-1];
    if(dz>0) up+=dz; else dn-=dz;
    if(Math.abs(GRAD[i])>Math.abs(mx)) mx=GRAD[i];
  }
  return {up:up,dn:dn,max:mx};
}
function idxAt(km){
  var lo=0,hi=KM.length-1;
  if(km<=0) return 0;
  if(km>=TOTAL) return KM.length-1;
  while(lo<hi-1){ var m=(lo+hi)>>1; if(KM[m]<km) lo=m; else hi=m; }
  return lo;
}
function eleAt(km){
  var i=idxAt(km);
  if(i>=KM.length-1) return ELE[KM.length-1];
  var t=(km-KM[i])/Math.max(1e-6,KM[i+1]-KM[i]);
  return ELE[i]+(ELE[i+1]-ELE[i])*t;
}

var cv=document.getElementById("prof"), cx=cv.getContext("2d");
var dpr=1, W=0, H=0;
var viewFrom=0, viewTo=TOTAL;      // window in metres along the route
var here=null, meKm=null, follow=false, watchId=null;
var PADL=42, PADR=10, PADT=12, PADB=20;

function css(v){return getComputedStyle(document.body).getPropertyValue(v).trim()}
function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  var r=document.getElementById("stage").getBoundingClientRect();
  W=r.width; H=r.height;
  cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
  cx.setTransform(dpr,0,0,dpr,0,0);
  draw();
}
function xOf(km){ return PADL+(km-viewFrom)/(viewTo-viewFrom)*(W-PADL-PADR); }
function kmOf(x){ return viewFrom+(x-PADL)/(W-PADL-PADR)*(viewTo-viewFrom); }
var yLo=0,yHi=3000;
function yOf(e){ return PADT+(1-(e-yLo)/(yHi-yLo))*(H-PADT-PADB); }

function fitY(){
  var i0=idxAt(viewFrom), i1=idxAt(viewTo);
  var lo=1e9,hi=-1e9;
  for(var i=i0;i<=i1;i++){ if(ELE[i]<lo)lo=ELE[i]; if(ELE[i]>hi)hi=ELE[i]; }
  if(lo>hi){ lo=0; hi=3000; }
  var pad=Math.max(60,(hi-lo)*0.12);
  yLo=Math.max(0,Math.floor((lo-pad)/100)*100);
  yHi=Math.ceil((hi+pad)/100)*100;
}
function draw(){
  if(!W) return;
  fitY();
  cx.fillStyle=css("--night"); cx.fillRect(0,0,W,H);

  // horizontal gridlines + elevation labels
  var step = (yHi-yLo)>2000?500:((yHi-yLo)>800?250:100);
  cx.strokeStyle=css("--rule"); cx.lineWidth=1;
  cx.font="10px "+css("--font-num"); cx.fillStyle=css("--lime-dim");
  for(var e=Math.ceil(yLo/step)*step;e<=yHi;e+=step){
    var y=yOf(e);
    cx.globalAlpha=.5; cx.beginPath(); cx.moveTo(PADL,y); cx.lineTo(W-PADR,y); cx.stroke();
    cx.globalAlpha=1; cx.fillText(e+"", 4, y+3);
  }

  // the profile, one filled column per pixel, coloured by gradient
  var base=yOf(yLo);
  var px0=Math.floor(PADL), px1=Math.ceil(W-PADR);
  for(var x=px0;x<px1;x++){
    var kmA=kmOf(x), kmB=kmOf(x+1);
    var i=idxAt((kmA+kmB)/2);
    var g=GRAD[i];
    var eA=eleAt(kmA), eB=eleAt(kmB);
    var top=Math.min(yOf(eA),yOf(eB));
    cx.fillStyle=bandOf(g).c;
    cx.globalAlpha=(g<0)?0.72:1;             // descents a shade lighter
    cx.fillRect(x,top,1.2,base-top);
    cx.globalAlpha=1;
  }
  // crisp ridge line over the top
  cx.strokeStyle="rgba(255,255,255,.35)"; cx.lineWidth=1;
  cx.beginPath();
  for(var x2=px0;x2<px1;x2++){
    var y2=yOf(eleAt(kmOf(x2)));
    if(x2===px0) cx.moveTo(x2,y2); else cx.lineTo(x2,y2);
  }
  cx.stroke();

  // day boundaries
  cx.font="600 9px "+css("--font-ui");
  for(var d=1;d<DAYS.length;d++){
    var ek=dayEndKm(d);
    if(ek==null) continue;
    var x3=xOf(ek);
    if(x3<PADL-2||x3>W-PADR+2) continue;
    cx.strokeStyle=css("--rule"); cx.globalAlpha=.9; cx.lineWidth=1;
    cx.beginPath(); cx.moveTo(x3,PADT); cx.lineTo(x3,base); cx.stroke(); cx.globalAlpha=1;
    cx.fillStyle=css("--lime-dim");
    cx.fillText("D"+d, x3+2, PADT+9);
  }

  // waypoints: huts and passes
  var span=(viewTo-viewFrom)/1000;
  PTS.forEach(function(p){
    if(p.km==null) return;
    var x4=xOf(p.km);
    if(x4<PADL||x4>W-PADR) return;
    var big=(p.stay||p.t==="rifugio"||p.t==="bivacco");
    if(!big && span>60) return;
    var y4=yOf(eleAt(p.km));
    cx.fillStyle=p.stay?css("--cai-lift"):css("--lime-dim");
    cx.beginPath(); cx.arc(x4,y4,p.stay?3.4:2.2,0,7); cx.fill();
    if(span<45 || p.stay){
      var lbl=p.n.replace(/^(Rifugio|Bivacco|Capanna|Malga|Passo|Forcella) /,"");
      if(lbl.length>15) lbl=lbl.slice(0,14)+"…";
      cx.save();
      cx.translate(x4,y4-6); cx.rotate(-Math.PI/2.6);
      cx.fillStyle=css("--lime"); cx.font="600 9.5px "+css("--font-ui");
      cx.fillText(lbl,4,3);
      cx.restore();
    }
  });

  // your position
  if(meKm!=null){
    var xm=xOf(meKm);
    if(xm>=PADL&&xm<=W-PADR){
      cx.strokeStyle=css("--glacier"); cx.lineWidth=2;
      cx.beginPath(); cx.moveTo(xm,PADT); cx.lineTo(xm,base); cx.stroke();
      var ym=yOf(eleAt(meKm));
      cx.beginPath(); cx.arc(xm,ym,5,0,7);
      cx.fillStyle=css("--glacier"); cx.fill();
      cx.strokeStyle="#fff"; cx.lineWidth=2; cx.stroke();
    }
  }

  // fixed crosshair at centre
  var xc=PADL+(W-PADL-PADR)/2;
  cx.strokeStyle=css("--sign"); cx.lineWidth=1; cx.globalAlpha=.85;
  cx.beginPath(); cx.moveTo(xc,PADT); cx.lineTo(xc,base); cx.stroke(); cx.globalAlpha=1;
  var kc=kmOf(xc), yc=yOf(eleAt(kc));
  cx.beginPath(); cx.arc(xc,yc,3.5,0,7); cx.fillStyle=css("--sign"); cx.fill();

  // x labels
  cx.fillStyle=css("--lime-dim"); cx.font="10px "+css("--font-num");
  cx.fillText((viewFrom/1000).toFixed(viewTo-viewFrom<20000?1:0)+" km", PADL, H-6);
  var rt=(viewTo/1000).toFixed(viewTo-viewFrom<20000?1:0)+" km";
  cx.fillText(rt, W-PADR-cx.measureText(rt).width, H-6);

  updateRead(kc);
}
function updateRead(kc){
  document.getElementById("rKm").textContent=(kc/1000).toFixed(2)+" km";
  document.getElementById("rEle").textContent=Math.round(eleAt(kc))+" m";
  var g=GRAD[idxAt(kc)];
  var b=bandOf(g);
  var el=document.getElementById("rGrad");
  el.textContent=(g>=0?"+":"")+g.toFixed(0)+"%";
  el.style.color=b.c;
  if(meKm!=null){
    var i=todayIndex();
    var ek=(i>0)?dayEndKm(i):null;
    var txt=(meKm/1000).toFixed(1)+" km";
    if(ek!=null&&ek>meKm){
      var s=statsBetween(meKm,ek);
      txt+=" · ↑"+Math.round(s.up)+" m left";
    }
    document.getElementById("rMe").textContent=txt;
  }
}
function todayIndex(){
  var d=new Date();
  var iso=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  for(var i=0;i<DAY_ISO.length;i++) if(DAY_ISO[i]===iso) return i;
  if(meKm!=null){
    for(var j=1;j<DAYS.length;j++){
      var e=dayEndKm(j);
      if(e!=null&&e>meKm+50) return j;
    }
  }
  return -1;
}

/* ---- day table ---- */
function buildDays(){
  var now=todayIndex();
  var h="";
  var tu=0,td=0,tk=0;
  DAYS.forEach(function(day,i){
    var ek=dayEndKm(i);
    if(ek==null) return;
    var sk=dayStartKm(i);
    if(ek-sk<50) return;
    var s=statsBetween(sk,ek);
    tu+=s.up; td+=s.dn; tk+=(ek-sk);
    h+='<button class="drow'+(i===now?" now":"")+'" data-from="'+sk+'" data-to="'+ek+'">'+
       '<span class="nm"><b>'+day.n+'</b><i>'+day.title+'  ·  max '+Math.round(Math.abs(s.max))+'%</i></span>'+
       '<span>'+((ek-sk)/1000).toFixed(1)+'</span>'+
       '<span class="up">↑'+Math.round(s.up)+'</span>'+
       '<span>↓'+Math.round(s.dn)+'</span></button>';
  });
  h+='<div class="drow" style="background:var(--rock-2)">'+
     '<span class="nm"><b>Whole route</b></span>'+
     '<span>'+(tk/1000).toFixed(1)+'</span>'+
     '<span class="up">↑'+Math.round(tu)+'</span>'+
     '<span>↓'+Math.round(td)+'</span></div>';
  document.getElementById("dayRows").innerHTML=h;
  Array.prototype.forEach.call(document.querySelectorAll(".drow[data-from]"),function(b){
    b.onclick=function(){
      var f=+b.dataset.from, t=+b.dataset.to, pad=(t-f)*0.08;
      setView(f-pad,t+pad);
    };
  });
}

/* ---- view control ---- */
function setView(a,b){
  var span=Math.max(600,Math.min(TOTAL,b-a));
  if(a<0){ a=0; b=span; }
  if(b>TOTAL){ b=TOTAL; a=TOTAL-span; }
  if(a<0) a=0;
  viewFrom=a; viewTo=b;
  draw();
}
function zoomBy(f,anchorKm){
  var span=(viewTo-viewFrom)*f;
  span=Math.max(600,Math.min(TOTAL,span));
  var t=(anchorKm-viewFrom)/(viewTo-viewFrom);
  setView(anchorKm-span*t, anchorKm+span*(1-t));
}
document.getElementById("btnIn").onclick=function(){ zoomBy(0.6,kmOf(PADL+(W-PADL-PADR)/2)); };
document.getElementById("btnOut").onclick=function(){ zoomBy(1.7,kmOf(PADL+(W-PADL-PADR)/2)); };
document.getElementById("btnFit").onclick=function(){ follow=false; setMe(); setView(0,TOTAL); };

var ptrs={}, lastPinch=0, lastX=null;
cv.addEventListener("pointerdown",function(e){
  cv.setPointerCapture(e.pointerId);
  ptrs[e.pointerId]={x:e.clientX}; lastPinch=0; lastX=e.clientX;
});
cv.addEventListener("pointermove",function(e){
  if(!ptrs[e.pointerId]) return;
  var ks=Object.keys(ptrs);
  if(ks.length===1){
    var dx=e.clientX-lastX;
    lastX=e.clientX; ptrs[e.pointerId]={x:e.clientX};
    if(Math.abs(dx)>0){
      follow=false; setMe();
      var perPx=(viewTo-viewFrom)/(W-PADL-PADR);
      setView(viewFrom-dx*perPx, viewTo-dx*perPx);
    }
  } else if(ks.length===2){
    ptrs[e.pointerId]={x:e.clientX};
    var a=ptrs[ks[0]].x, b=ptrs[ks[1]].x;
    var d=Math.abs(a-b);
    if(lastPinch&&d>0){
      var r=cv.getBoundingClientRect();
      zoomBy(lastPinch/d, kmOf((a+b)/2-r.left));
    }
    lastPinch=d;
  }
});
function endPtr(e){ delete ptrs[e.pointerId]; if(Object.keys(ptrs).length<2) lastPinch=0; }
cv.addEventListener("pointerup",endPtr);
cv.addEventListener("pointercancel",endPtr);
cv.addEventListener("wheel",function(e){
  e.preventDefault();
  var r=cv.getBoundingClientRect();
  zoomBy(e.deltaY>0?1.12:0.89, kmOf(e.clientX-r.left));
},{passive:false});

/* ---- GPS ---- */
function projectMe(){
  if(!here) return null;
  var bi=0,bd=1e12;
  for(var i=0;i<ROUTE.length;i++){
    var d=dist(here.lat,here.lon,ROUTE[i][0],ROUTE[i][1]);
    if(d<bd){bd=d;bi=i}
  }
  return {km:KM[bi],off:bd};
}
function setMe(){ document.getElementById("btnMe").classList.toggle("live",follow); }
function startGPS(){
  if(!navigator.geolocation||watchId!==null) return;
  watchId=navigator.geolocation.watchPosition(function(pos){
    here={lat:pos.coords.latitude,lon:pos.coords.longitude,acc:pos.coords.accuracy};
    var m=projectMe();
    meKm=m?m.km:null;
    if(follow&&meKm!=null){
      var span=viewTo-viewFrom;
      setView(meKm-span/2, meKm+span/2);
    } else draw();
    buildDays();
  },function(){
    document.getElementById("rMe").textContent="no fix";
  },{enableHighAccuracy:true,maximumAge:5000,timeout:20000});
}
document.getElementById("btnMe").onclick=function(){
  startGPS();
  follow=!follow; setMe();
  if(follow&&meKm!=null){
    var span=Math.min(viewTo-viewFrom,14000);
    setView(meKm-span/2,meKm+span/2);
  }
};

window.addEventListener("resize",resize);
window.addEventListener("orientationchange",function(){setTimeout(resize,220)});
resize(); buildDays(); startGPS();
</script>
